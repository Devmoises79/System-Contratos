<!DOCTYPE html>
<html>
<head>
    <title>Teste Rápido de Botões</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">🔧 Teste de Ações de Contrato</h3>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">ID do Contrato:</label>
                    <input type="number" id="contratoId" class="form-control" value="1" style="width: 200px;">
                </div>
                
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <button class="btn btn-success" onclick="testarAcao('autorizar')">Autorizar</button>
                    <button class="btn btn-warning" onclick="testarAcao('suspender')">Suspender</button>
                    <button class="btn btn-secondary" onclick="testarAcao('encerrar')">Encerrar</button>
                    <button class="btn btn-danger" onclick="testarAcao('cancelar')">Cancelar</button>
                    <button class="btn btn-success" onclick="testarAcao('reativar')">Reativar</button>
                    <button class="btn btn-info text-white" onclick="testarAcao('duplicar')">Duplicar</button>
                </div>
                
                <div class="card bg-dark text-white">
                    <div class="card-header">Resultado:</div>
                    <div class="card-body">
                        <pre id="resultado" style="color: #0f0; margin: 0;">Clique em um botão para testar</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function testarAcao(acao) {
            const id = document.getElementById('contratoId').value;
            const resultado = document.getElementById('resultado');
            
            resultado.textContent = '🔄 Processando...';
            
            try {
                console.log(`Testando ${acao} para contrato ${id}`);
                
                const response = await fetch(`/contrato/${id}/${acao}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const responseText = await response.text();
                
                try {
                    const data = JSON.parse(responseText);
                    resultado.textContent = JSON.stringify(data, null, 2);
                } catch {
                    resultado.textContent = responseText;
                }
                
            } catch (error) {
                resultado.textContent = `❌ Erro: ${error.message}`;
                console.error(error);
            }
        }
    </script>
</body>
</html>
