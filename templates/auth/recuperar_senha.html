<!-- templates/auth/recuperar_senha.html -->
{% extends "base.html" %}

{% block title %}Recuperar Senha - ValidaPy{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100" style="margin-top: -70px;">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
        <div class="card-custom p-4 p-lg-5 fade-in">
            <div class="text-center mb-4">
                <div class="logo-container mx-auto mb-3" style="width: 50px; height: 50px; background: linear-gradient(135deg, var(--azul-principal), var(--verde-principal));">
                    <span class="logo-text" style="font-size: 1.8rem;">V</span>
                </div>
                <h2 class="fw-bold mb-2" style="color: var(--cinza-texto);">Recuperar Senha</h2>
                <p class="text-muted small">Digite seu e-mail para receber as instruções</p>
            </div>

            <form method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-4">
                    <label class="form-label fw-medium mb-2">E-mail cadastrado</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">
                            <i class="bi bi-envelope" style="color: var(--azul-principal);"></i>
                        </span>
                        <input type="email" class="form-control border-start-0" name="email" 
                               placeholder="seu@email.com" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                    <i class="bi bi-send me-2"></i>
                    Enviar Instruções
                </button>

                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="small text-decoration-none" style="color: var(--azul-principal);">
                        <i class="bi bi-arrow-left me-1"></i>
                        Voltar para o login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
