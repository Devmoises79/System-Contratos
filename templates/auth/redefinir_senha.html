{% extends "base.html" %}

{% block title %}Redefinir Senha - ValidaPy{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-success text-white text-center rounded-top-4">
                    <h4 class="mb-0">
                        <i class="bi bi-shield-lock me-2"></i>
                        Redefinir Senha
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info mb-4">
                        <i class="bi bi-person-circle me-2"></i>
                        Olá, <strong>{{ usuario.nome }}</strong>!
                        <hr class="my-2">
                        <small>Crie uma nova senha forte para sua conta.</small>
                    </div>
                    
                    <form method="POST" id="formRedefinir">
                        <div class="mb-3">
                            <label for="nova_senha" class="form-label">
                                <i class="bi bi-key"></i> Nova Senha
                            </label>
                            <input type="password" 
                                   class="form-control form-control-lg" 
                                   id="nova_senha" 
                                   name="nova_senha" 
                                   required
                                   minlength="8">
                            <div class="form-text">
                                <small>
                                    <i class="bi bi-info-circle"></i>
                                    Mínimo 8 caracteres, incluindo maiúsculas, minúsculas, números e símbolos
                                </small>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="confirmar_senha" class="form-label">
                                <i class="bi bi-key-fill"></i> Confirmar Senha
                            </label>
                            <input type="password" 
                                   class="form-control form-control-lg" 
                                   id="confirmar_senha" 
                                   name="confirmar_senha" 
                                   required>
                        </div>
                        
                        <div id="senha-feedback" class="mb-3"></div>
                        
                        <button type="submit" class="btn btn-success btn-lg w-100" id="submit-btn">
                            <i class="bi bi-check-circle me-2"></i>
                            Redefinir Senha
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const novaSenha = document.getElementById('nova_senha');
const confirmarSenha = document.getElementById('confirmar_senha');
const feedback = document.getElementById('senha-feedback');
const submitBtn = document.getElementById('submit-btn');

function validarSenha() {
    const senha = novaSenha.value;
    const confirmacao = confirmarSenha.value;
    
    let validacoes = {
        length: senha.length >= 8,
        uppercase: /[A-Z]/.test(senha),
        lowercase: /[a-z]/.test(senha),
        number: /[0-9]/.test(senha),
        special: /[!@#$%^&*(),.?":{}|<>_\-+=;\[\]]/.test(senha),
        match: senha === confirmacao && senha !== ''
    };
    
    const todasValidas = Object.values(validacoes).every(v => v === true);
    
    if (senha === '') {
        feedback.innerHTML = '';
        submitBtn.disabled = false;
        return;
    }
    
    let html = '<div class="alert alert-info small">';
    html += '<strong>📋 Requisitos da senha:</strong><ul class="mb-0 mt-2">';
    html += `<li class="${validacoes.length ? 'text-success' : 'text-danger'}">
                ${validacoes.length ? '✅' : '❌'} Mínimo 8 caracteres</li>`;
    html += `<li class="${validacoes.uppercase ? 'text-success' : 'text-danger'}">
                ${validacoes.uppercase ? '✅' : '❌'} Letra maiúscula (A-Z)</li>`;
    html += `<li class="${validacoes.lowercase ? 'text-success' : 'text-danger'}">
                ${validacoes.lowercase ? '✅' : '❌'} Letra minúscula (a-z)</li>`;
    html += `<li class="${validacoes.number ? 'text-success' : 'text-danger'}">
                ${validacoes.number ? '✅' : '❌'} Número (0-9)</li>`;
    html += `<li class="${validacoes.special ? 'text-success' : 'text-danger'}">
                ${validacoes.special ? '✅' : '❌'} Caractere especial (!@#$%...)</li>`;
    
    if (confirmacao !== '') {
        html += `<li class="${validacoes.match ? 'text-success' : 'text-danger'} mt-2">
                    ${validacoes.match ? '✅' : '❌'} As senhas coincidem</li>`;
    }
    
    html += '</ul></div>';
    
    feedback.innerHTML = html;
    
    // Habilita/desabilita botão baseado na validação
    if (confirmacao !== '') {
        submitBtn.disabled = !todasValidas;
    } else {
        submitBtn.disabled = false;
    }
}

novaSenha.addEventListener('input', validarSenha);
confirmarSenha.addEventListener('input', validarSenha);
</script>

<style>
.text-success {
    color: #198754 !important;
}
.text-danger {
    color: #dc3545 !important;
}
</style>
{% endblock %}
