<!-- templates/contratos/novo.html -->
{% extends "base.html" %}

{% block title %}Novo Contrato - ValidaPy{% endblock %}

{% block content %}
<div class="fade-in">
    <!-- Cabeçalho -->
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('listar_contratos') }}" style="color: var(--cinza-texto); text-decoration: none; margin-right: 1rem;">
            <i class="bi bi-arrow-left fs-4"></i>
        </a>
        <div>
            <h1 style="font-size: 2rem; font-weight: 700; color: var(--cinza-texto); margin-bottom: 0.25rem;">Novo Contrato</h1>
            <p style="color: var(--cinza-texto); opacity: 0.7; font-size: 1rem;">Preencha os dados para gerar um novo contrato</p>
        </div>
    </div>

    <!-- Card do Formulário -->
    <div class="card-custom p-4 p-lg-5">
        <form method="POST" id="contratoForm">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <!-- Dados do Contratante -->
            <div class="mb-4">
                <h5 style="font-size: 1.1rem; font-weight: 600; color: var(--cinza-texto); margin-bottom: 1.5rem; display: flex; align-items: center;">
                    <span style="width: 32px; height: 32px; background: var(--azul-claro); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 10px;">
                        <i class="bi bi-person" style="color: var(--azul-principal);"></i>
                    </span>
                    Dados do Contratante
                </h5>
                
                <div class="row g-3">
                    <div class="col-12">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">
                            Nome / Razão Social <span style="color: var(--vermelho-principal);">*</span>
                        </label>
                        <input type="text" class="form-control" name="contratante_nome" id="contratante_nome" required
                               style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;">
                    </div>
                    
                    <div class="col-md-6">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">CNPJ/CPF</label>
                        <input type="text" class="form-control" name="contratante_cnpj"
                               style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;">
                    </div>
                    
                    <div class="col-md-6">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">Email</label>
                        <input type="email" class="form-control" name="contratante_email"
                               style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;">
                    </div>
                </div>
            </div>

            <!-- Dados da Contratada -->
            <div class="mb-4">
                <h5 style="font-size: 1.1rem; font-weight: 600; color: var(--cinza-texto); margin-bottom: 1.5rem; display: flex; align-items: center;">
                    <span style="width: 32px; height: 32px; background: var(--amarelo-claro); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 10px;">
                        <i class="bi bi-building" style="color: var(--amarelo-escuro);"></i>
                    </span>
                    Dados da Contratada
                </h5>
                
                <div class="row g-3">
                    <div class="col-12">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">
                            Nome / Razão Social <span style="color: var(--vermelho-principal);">*</span>
                        </label>
                        <input type="text" class="form-control" name="contratada_nome" id="contratada_nome" required
                               style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;">
                    </div>
                    
                    <div class="col-md-6">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">CNPJ/CPF</label>
                        <input type="text" class="form-control" name="contratada_cnpj"
                               style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;">
                    </div>
                    
                    <div class="col-md-6">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">Email</label>
                        <input type="email" class="form-control" name="contratada_email"
                               style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;">
                    </div>
                </div>
            </div>

            <!-- Detalhes do Contrato -->
            <div class="mb-4">
                <h5 style="font-size: 1.1rem; font-weight: 600; color: var(--cinza-texto); margin-bottom: 1.5rem; display: flex; align-items: center;">
                    <span style="width: 32px; height: 32px; background: var(--vermelho-claro); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-right: 10px;">
                        <i class="bi bi-file-text" style="color: var(--vermelho-principal);"></i>
                    </span>
                    Detalhes do Contrato
                </h5>
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">
                            Valor (R$) <span style="color: var(--vermelho-principal);">*</span>
                        </label>
                        <input type="number" step="0.01" class="form-control" name="valor" id="valor" required
                               style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;">
                    </div>
                    
                    <div class="col-md-6">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">
                            Prazo (dias) <span style="color: var(--vermelho-principal);">*</span>
                        </label>
                        <input type="number" class="form-control" name="prazo_dias" required
                               style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;">
                    </div>
                    
                    <div class="col-12">
                        <label style="font-weight: 500; color: var(--cinza-texto); margin-bottom: 0.5rem; display: block;">
                            Descrição dos Serviços <span style="color: var(--vermelho-principal);">*</span>
                        </label>
                        <textarea class="form-control" name="descricao" rows="6" required
                                  style="border: 2px solid var(--cinza-claro); border-radius: 12px; padding: 0.75rem 1rem;"></textarea>
                    </div>
                </div>
            </div>

            <!-- Botões -->
            <div class="d-flex justify-content-end gap-2 mt-4 pt-3" style="border-top: 2px solid var(--cinza-claro);">
                <a href="{{ url_for('listar_contratos') }}" class="btn" style="background: transparent; border: 2px solid var(--cinza-claro); color: var(--cinza-texto); padding: 0.6rem 1.5rem; border-radius: 12px; text-decoration: none;">
                    Cancelar
                </a>
                <button type="submit" class="btn" style="background: var(--azul-principal); color: white; padding: 0.6rem 1.5rem; border-radius: 12px; border: none;">
                    <i class="bi bi-file-pdf me-2"></i>
                    Gerar Contrato
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
