{% extends "base.html" %}

{% block title %}Meu Perfil - System Contratos{% endblock %}

{% block page_title %}
<i class="fas fa-user-circle me-2"></i> Meu Perfil
{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <div class="card-branco">
        <div class="card-body p-4">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Nome completo</label>
                        <input type="text" name="nome" class="form-control" value="{{ usuario.nome }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">E-mail</label>
                        <input type="email" name="email" class="form-control" value="{{ usuario.email }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Perfil</label>
                        <input type="text" class="form-control" value="{{ usuario.perfil }}" disabled>
                        <small class="text-muted">O perfil não pode ser alterado</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Empresa</label>
                        <input type="text" class="form-control" value="{{ usuario.empresa_nome }}" disabled>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn-roxo mt-2">
                            <i class="fas fa-save me-2"></i> Salvar Alterações
                        </button>
                        <a href="{{ url_for('configuracoes.index') }}" class="btn-outline-roxo mt-2 ms-2">
                            <i class="fas fa-arrow-left me-2"></i> Voltar
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .card-branco {
        background: white;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    .form-control {
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        padding: 10px 14px;
    }
    .form-control:focus {
        border-color: #6B46C1;
        box-shadow: 0 0 0 3px rgba(107, 70, 193, 0.1);
    }
    .btn-roxo {
        background: linear-gradient(135deg, #6B46C1, #553C9A);
        border: none;
        color: white;
        border-radius: 40px;
        padding: 10px 28px;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn-roxo:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(107, 70, 193, 0.3);
        color: white;
    }
    .btn-outline-roxo {
        border: 2px solid #6B46C1;
        color: #6B46C1;
        background: white;
        border-radius: 40px;
        padding: 8px 26px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
    }
    .btn-outline-roxo:hover {
        background: linear-gradient(135deg, #6B46C1, #553C9A);
        color: white;
        transform: translateY(-2px);
    }
</style>
{% endblock %}
