{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="fw-semibold mb-0">Contratos por Mês</h5>
                </div>
                <div class="card-body">
                    {% if contratos_por_mes and contratos_por_mes|length > 0 %}
                    <canvas id="graficoContratos" style="max-height: 280px; width: 100%;"></canvas>
                    {% else %}
                    <div class="alert alert-info text-center">
                        <i class="fas fa-chart-bar"></i> Nenhum contrato encontrado para exibir no gráfico.
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    {% if contratos_por_mes and contratos_por_mes|length > 0 %}
    // Dados reais do banco de dados
    const dados = {{ contratos_por_mes | tojson | safe }};
    
    console.log('Dados recebidos:', dados);
    
    // Extrair labels (meses) e valores
    const labels = dados.map(item => item.mes);
    const valores = dados.map(item => item.total);
    
    // Configurar o gráfico
    const ctx = document.getElementById('graficoContratos').getContext('2d');
    
    // Destruir gráfico existente se houver
    if (window.contratosChart) {
        window.contratosChart.destroy();
    }
    
    window.contratosChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Quantidade de Contratos',
                data: valores,
                backgroundColor: '#3498db',
                borderColor: '#2980b9',
                borderWidth: 2,
                borderRadius: 5,
                barPercentage: 0.7,
                categoryPercentage: 0.8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        font: {
                            size: 12,
                            weight: 'bold'
                        }
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return `Contratos: ${context.raw}`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1,
                        precision: 0,
                        font: {
                            size: 11
                        }
                    },
                    title: {
                        display: true,
                        text: 'Quantidade de Contratos',
                        font: {
                            size: 12,
                            weight: 'bold'
                        }
                    },
                    grid: {
                        color: '#e0e0e0'
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: 'Mês/Ano',
                        font: {
                            size: 12,
                            weight: 'bold'
                        }
                    },
                    ticks: {
                        rotation: 45,
                        autoSkip: true,
                        maxRotation: 45,
                        minRotation: 45,
                        font: {
                            size: 11
                        }
                    },
                    grid: {
                        display: false
                    }
                }
            },
            layout: {
                padding: {
                    left: 10,
                    right: 10,
                    top: 10,
                    bottom: 10
                }
            }
        }
    });
    {% endif %}
});
</script>

<style>
    #graficoContratos {
        max-height: 280px;
        width: 100% !important;
    }
    .card-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    .alert-info {
        background-color: #e3f2fd;
        border-color: #90caf9;
        color: #1565c0;
    }
</style>
{% endblock %}
