{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-12">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-trophy-fill me-2"></i> Minhas Conquistas</h4>
                </div>
                <div class="card-body text-center">
                    <div class="display-1 mb-3">
                        {% if nivel == 'Diamante' %}
                            💎
                        {% elif nivel == 'Ouro' %}
                            🥇
                        {% elif nivel == 'Prata' %}
                            🥈
                        {% else %}
                            🥉
                        {% endif %}
                    </div>
                    <h3>Nível: {{ nivel }}</h3>
                    <div class="progress mb-4" style="height: 25px;">
                        <div class="progress-bar bg-success" role="progressbar" 
                             style="width: {{ (pontos % 200) / 2 }}%">
                            {{ pontos }} pontos
                        </div>
                    </div>
                    <p class="text-muted">Continue engajado para ganhar mais pontos e subir de nível!</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
