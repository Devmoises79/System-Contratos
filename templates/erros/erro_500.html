<!-- templates/erros/500.html -->
{% extends "base.html" %}

{% block title %}Erro Interno - ValidaPy{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100" style="margin-top: -70px;">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
        <div class="card-custom p-5 text-center fade-in">
            <!-- Ícone de erro -->
            <div class="position-relative d-inline-block mb-4">
                <div class="card-icon vermelho" style="width: 120px; height: 120px; font-size: 4rem; animation: pulse 2s infinite;">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="background: var(--vermelho-escuro) !important; font-size: 1rem;">
                    500
                </span>
            </div>
            
            <h1 class="fw-bold mb-3" style="color: var(--cinza-texto); font-size: 3rem;">Erro Interno</h1>
            
            <div class="alert alert-danger d-flex align-items-center mb-4" style="background: var(--vermelho-claro); border: none; border-radius: 12px;">
                <i class="bi bi-bug-fill fs-4 me-3" style="color: var(--vermelho-principal);"></i>
                <div class="text-start">
                    <strong class="d-block">Ops! Algo deu errado</strong>
                    <small>Nossa equipe foi notificada e está trabalhando na solução</small>
                </div>
            </div>
            
            <p class="text-muted mb-4">
                <i class="bi bi-clock-history me-1"></i>
                Tente novamente em alguns minutos
            </p>
            
            <div class="d-grid gap-2">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary py-3 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-arrow-repeat"></i>
                    Tentar Novamente
                </a>
                <a href="#" class="btn btn-outline-secondary py-2" onclick="window.location.reload()">
                    <i class="bi bi-arrow-clockwise me-2"></i>
                    Recarregar Página
                </a>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}
</style>
{% endblock %}
