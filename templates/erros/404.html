<!-- templates/erros/404.html -->
{% extends "base.html" %}

{% block title %}Página Não Encontrada - ValidaPy{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100" style="margin-top: -70px;">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
        <div class="stat-card p-5 text-center">
            <div class="stat-icon warning d-inline-flex align-items-center justify-content-center mb-4" style="width: 100px; height: 100px; font-size: 3rem;">
                <i class="bi bi-question-circle"></i>
            </div>
            
            <h1 class="display-1 fw-bold" style="color: #f59e0b;">404</h1>
            <h3 class="fw-semibold mb-3" style="color: #1f2937;">Página Não Encontrada</h3>
            <p class="mb-4" style="color: #6b7280;">A página que você está procurando não existe ou foi removida.</p>
            
            <a href="{{ url_for('dashboard') }}" class="btn py-2 px-4"
               style="background: #3b82f6; color: white; border: none;">
                <i class="bi bi-house me-2"></i>
                Voltar para o Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
