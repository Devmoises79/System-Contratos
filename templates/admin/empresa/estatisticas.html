{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3>📈 Estatísticas da Empresa</h3>
                </div>
                <div class="card-body">
                    <!-- Cards de estatísticas -->
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <div class="card bg-primary text-white">
                                <div class="card-body">
                                    <h5 class="card-title">Total de Contratos</h5>
                                    <h2 class="card-text">{{ stats.total_contratos }}</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-success text-white">
                                <div class="card-body">
                                    <h5 class="card-title">Valor Total</h5>
                                    <h2 class="card-text">R$ {{ "%.2f"|format(stats.valor_total) }}</h2>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-info text-white">
                                <div class="card-body">
                                    <h5 class="card-title">Total de Usuários</h5>
                                    <h2 class="card-text">{{ stats.total_usuarios }}</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico de Contratos por Mês -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h4>📊 Contratos por Mês</h4>
                                </div>
                                <div class="card-body">
                                    <canvas id="graficoContratos" style="width: 100%; max-height: 280px; min-height: 200px;"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico de Contratos por Status -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header">
                                    <h4>📊 Contratos por Status</h4>
                                </div>
                                <div class="card-body">
                                    <canvas id="graficoStatus" style="width: 100%; max-height: 280px; min-height: 200px;"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
// Função principal para inicializar todos os gráficos
function inicializarGraficos() {
    console.log('🚀 Inicializando gráficos...');
    
    // ==================== GRÁFICO 1: Contratos por Mês ====================
    const canvasMes = document.getElementById('graficoContratos');
    if (canvasMes) {
        try {
            // Receber dados do backend
            const dadosMes = {{ contratos_por_mes | tojson | safe }};
            console.log('📊 Dados recebidos (por mês):', dadosMes);
            
            // Filtrar apenas meses com contratos (total > 0)
            let dadosFiltrados = [];
            if (dadosMes && dadosMes.length > 0) {
                dadosFiltrados = dadosMes.filter(item => item.total > 0);
            }
            
            // Se não houver dados reais, usar dados mockados para teste
            if (dadosFiltrados.length === 0) {
                console.warn('⚠️ Nenhum dado real encontrado, usando dados de exemplo');
                dadosFiltrados = [
                    { mes: 'Mai/2025', total: 1 },
                    { mes: 'Jun/2025', total: 1 }
                ];
            }
            
            // Extrair labels e valores
            const labels = dadosFiltrados.map(item => item.mes);
            const valores = dadosFiltrados.map(item => item.total);
            
            console.log('📊 Labels:', labels);
            console.log('📊 Valores:', valores);
            
            // Destruir gráfico existente se houver
            if (window.graficoMes) {
                window.graficoMes.destroy();
            }
            
            // Criar novo gráfico
            const ctx = canvasMes.getContext('2d');
            window.graficoMes = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Quantidade de Contratos',
                        data: valores,
                        backgroundColor: '#3498db',
                        borderColor: '#2980b9',
                        borderWidth: 2,
                        borderRadius: 8,
                        barPercentage: 0.6,
                        categoryPercentage: 0.8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: { size: 12, weight: 'bold' },
                                usePointStyle: true,
                                boxWidth: 10
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            titleFont: { size: 12, weight: 'bold' },
                            bodyFont: { size: 11 },
                            callbacks: {
                                label: function(context) {
                                    return `📄 Contratos: ${context.raw}`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1,
                                precision: 0,
                                font: { size: 11 },
                                callback: function(value) {
                                    return value + ' contrato(s)';
                                }
                            },
                            title: {
                                display: true,
                                text: 'Quantidade de Contratos',
                                font: { size: 12, weight: 'bold' }
                            },
                            grid: {
                                color: '#e0e0e0',
                                drawBorder: true
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Mês/Ano',
                                font: { size: 12, weight: 'bold' }
                            },
                            ticks: {
                                font: { size: 11, weight: 'bold' },
                                autoSkip: false,
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: {
                                display: false
                            }
                        }
                    },
                    layout: {
                        padding: {
                            left: 10,
                            right: 10,
                            top: 10,
                            bottom: 20
                        }
                    }
                }
            });
            
            console.log('✅ Gráfico de contratos por mês criado com sucesso!');
            
        } catch (error) {
            console.error('❌ Erro ao criar gráfico de meses:', error);
            canvasMes.parentElement.innerHTML += '<div class="alert alert-danger mt-2">Erro ao carregar gráfico de contratos por mês</div>';
        }
    } else {
        console.error('❌ Canvas graficoContratos não encontrado!');
    }
    
    // ==================== GRÁFICO 2: Contratos por Status ====================
    const canvasStatus = document.getElementById('graficoStatus');
    if (canvasStatus) {
        try {
            // Receber dados do backend
            const dadosStatus = {{ contratos_por_status | tojson | safe }};
            console.log('📊 Dados recebidos (por status):', dadosStatus);
            
            // Filtrar apenas status com contratos (total > 0)
            let dadosStatusFiltrados = [];
            if (dadosStatus && dadosStatus.length > 0) {
                dadosStatusFiltrados = dadosStatus.filter(item => item.total > 0);
            }
            
            // Mapeamento de status para nomes amigáveis
            const statusMap = {
                'rascunho': '📝 Rascunho',
                'em_analise': '🔍 Em Análise',
                'aguardando_aprovacao': '⏳ Aguardando Aprovação',
                'ativo': '✅ Ativo',
                'encerrado': '🔒 Encerrado',
                'cancelado': '❌ Cancelado'
            };
            
            // Cores para cada status
            const coresStatus = {
                'rascunho': '#95a5a6',
                'em_analise': '#3498db',
                'aguardando_aprovacao': '#f39c12',
                'ativo': '#2ecc71',
                'encerrado': '#e74c3c',
                'cancelado': '#e84393'
            };
            
            let labelsStatus = [];
            let valoresStatus = [];
            let cores = [];
            
            if (dadosStatusFiltrados.length > 0) {
                labelsStatus = dadosStatusFiltrados.map(item => statusMap[item.status] || item.status);
                valoresStatus = dadosStatusFiltrados.map(item => item.total);
                cores = dadosStatusFiltrados.map(item => coresStatus[item.status] || '#3498db');
            } else {
                // Dados mockados para teste
                console.warn('⚠️ Nenhum dado real de status encontrado, usando dados de exemplo');
                labelsStatus = ['📝 Rascunho', '🔍 Em Análise'];
                valoresStatus = [1, 1];
                cores = ['#95a5a6', '#3498db'];
            }
            
            console.log('📊 Labels Status:', labelsStatus);
            console.log('📊 Valores Status:', valoresStatus);
            
            // Destruir gráfico existente se houver
            if (window.graficoStatus) {
                window.graficoStatus.destroy();
            }
            
            // Criar novo gráfico de pizza
            const ctx = canvasStatus.getContext('2d');
            window.graficoStatus = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labelsStatus,
                    datasets: [{
                        data: valoresStatus,
                        backgroundColor: cores,
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 11 },
                                padding: 10
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = valoresStatus.reduce((a, b) => a + b, 0);
                                    const percentage = ((context.raw / total) * 100).toFixed(1);
                                    return `${context.label}: ${context.raw} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
            
            console.log('✅ Gráfico de status criado com sucesso!');
            
        } catch (error) {
            console.error('❌ Erro ao criar gráfico de status:', error);
            canvasStatus.parentElement.innerHTML += '<div class="alert alert-danger mt-2">Erro ao carregar gráfico de status</div>';
        }
    } else {
        console.error('❌ Canvas graficoStatus não encontrado!');
    }
}

// Aguardar o DOM carregar completamente
document.addEventListener('DOMContentLoaded', function() {
    // Pequeno delay para garantir que tudo esteja carregado
    setTimeout(inicializarGraficos, 100);
});

// Recarregar gráficos quando a janela for redimensionada
window.addEventListener('resize', function() {
    if (window.graficoMes) {
        window.graficoMes.resize();
    }
    if (window.graficoStatus) {
        window.graficoStatus.resize();
    }
});
</script>

<style>
    .card-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    .card-header h3, .card-header h4 {
        margin: 0;
        font-size: 1.25rem;
    }
    .bg-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .bg-success {
        background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        color: #333 !important;
    }
    .bg-info {
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        color: #333 !important;
    }
    canvas {
        width: 100% !important;
        height: auto !important;
    }
</style>
{% endblock %}
