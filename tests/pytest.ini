[pytest]
# Configuração do pytest para o projeto

# Diretórios de teste
testpaths = tests

# Arquivos de teste
python_files = test_*.py

# Classes de teste
python_classes = Test*

# Funções de teste
python_functions = test_*

# Opções padrão
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70

# Marcadores personalizados
markers =
    slow: Marca testes que são lentos
    integration: Marca testes de integração
    unit: Marca testes unitários

# Ignorar warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning